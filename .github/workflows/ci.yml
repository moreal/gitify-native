name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (Debug)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Gitify.xcodeproj \
            -scheme Gitify \
            -configuration Debug \
            -derivedDataPath build \
            build
