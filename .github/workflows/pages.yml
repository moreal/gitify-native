name: Pages

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Tests/GitifyUITests/**"
      - "docs/site/**"
      - "scripts/export-landing-screenshot.sh"
      - "project.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Capture app and build site
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Capture actual app screenshot
        run: |
          xcodebuild test \
            -project Gitify.xcodeproj \
            -scheme Gitify \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -resultBundlePath "$RUNNER_TEMP/GitifyLanding.xcresult" \
            -only-testing:GitifyUITests/PopoverStabilityUITests/testCaptureLandingScreenshot

      - name: Export screenshot
        run: |
          scripts/export-landing-screenshot.sh \
            "$RUNNER_TEMP/GitifyLanding.xcresult" \
            docs/site/assets/gitify-popover.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    name: Deploy landing page
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
