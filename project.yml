name: Gitify
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Gitify:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Gitify
        CFBundleDisplayName: Gitify
        CFBundleIconFile: app-icon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License. Native port of Gitify (gitify.io)."
        SUFeedURL: https://github.com/moreal/gitify-native/releases/latest/download/appcast.xml
        SUPublicEDKey: t/Ye5scQdmBW/96GXB8i/645i7+nRrllMY5wBUK3jXw=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moreal.gitify
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        DEAD_CODE_STRIPPING: YES
  GitifyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/GitifyUITests
    dependencies:
      - target: Gitify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moreal.gitify.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Gitify
  GitifyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GitifyTests
    dependencies:
      - target: Gitify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moreal.gitify.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  Gitify:
    build:
      targets:
        Gitify: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GitifyTests
        - GitifyUITests
